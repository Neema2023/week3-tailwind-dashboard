<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mp Isomi School | Admin Dashboard</title>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

    <div class="min-h-screen lg:flex">

        <!-- Sidebar -->
        <aside class="hidden w-64 shrink-0 bg-slate-900 text-white lg:flex lg:flex-col">
            <div class="border-b border-slate-700 p-6">
                <h1 class="text-xl font-bold">Mp Isomi School</h1>
                <p class="mt-1 text-sm text-slate-400">School Management</p>
            </div>

            <nav class="flex-1 space-y-2 p-4" aria-label="Main navigation">
                <a href="#" class="block rounded-lg bg-blue-600 px-4 py-3 font-medium text-white transition hover:bg-blue-500">▦ Dashboard</a>
                <a href="#" class="block rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white">♙ Students</a>
                <a href="#" class="block rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white">♧ Teachers</a>
                <a href="#" class="block rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white">▤ Classes</a>
                <a href="#" class="block rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white">✓ Attendance</a>
                <a href="#" class="block rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white">₣ Payments</a>
            </nav>

            <div class="border-t border-slate-700 p-4 text-sm text-slate-400">
                Academic Year 2026–2027
            </div>
        </aside>

        <!-- Main content -->
        <main class="min-w-0 flex-1">

            <!-- Top bar -->
            <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 bg-white px-4 py-4 sm:px-6 lg:px-8">
                <div>
                    <p class="text-sm text-slate-500">Mp Isomi School</p>
                    <h2 class="text-2xl font-bold text-slate-900">Dashboard</h2>
                </div>

                <div class="flex items-center gap-3">
                    <label for="dashboard-search" class="sr-only">Search dashboard</label>
                    <input id="dashboard-search" type="search" placeholder="Search..." class="w-32 rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200 sm:w-56">

                    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-bold text-blue-700" role="img" aria-label="Administrator avatar">
                        A
                    </div>
                </div>
            </header>

            <!-- Dashboard content will be added here -->
            <section class="p-4 sm:p-6 lg:p-8">
                <h3 class="text-lg font-semibold">Welcome back, Administrator!</h3>
                <p class="mt-2 text-slate-600">Your school overview will appear here.</p>
            </section>

        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
